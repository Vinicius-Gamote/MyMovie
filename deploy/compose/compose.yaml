services:
  database:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: mymovie
      POSTGRES_USER: mymovie
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - mymovie-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mymovie -d mymovie"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - private

  api:
    profiles: ["full"]
    build:
      context: ../..
      dockerfile: deploy/docker/api.Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Database: Host=database;Port=5432;Database=mymovie;Username=mymovie;Password=${POSTGRES_PASSWORD:-local-development-only}
      Database__Initialize: "true"
      Database__ApplyMigrations: "true"
      Tmdb__AccessToken: ${TMDB_ACCESS_TOKEN:?Set TMDB_ACCESS_TOKEN in an ignored .env file}
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "5080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://127.0.0.1:8080/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    networks:
      - private

  web:
    profiles: ["full"]
    build:
      context: ../..
      dockerfile: deploy/docker/web.Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "4200:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://127.0.0.1:8080/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true
    networks:
      - private

volumes:
  mymovie-postgres:

networks:
  private:
    driver: bridge
